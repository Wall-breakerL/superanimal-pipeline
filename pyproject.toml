[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "superanimal-pipeline"
version = "0.1.0"
description = "Reproducible single-mouse SuperAnimal inference, historical cleaning and workspace export"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy==1.26.4", "pandas==2.3.3", "tables==3.11.1", "opencv-python==4.11.0.86", "PyYAML==6.0.3"]

[project.optional-dependencies]
inference = ["deeplabcut==3.0.0rc14", "torch==2.8.0", "torchvision==0.23.0"]
dev = ["ruff==0.16.6"]

[project.scripts]
sap = "superanimal_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
extend-exclude = ["src/superanimal_pipeline/legacy.py", ".local"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
